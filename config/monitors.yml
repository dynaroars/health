# Monitors checked by scripts/check.py every 5 minutes via GitHub Actions.
#
# Add or remove entries freely -- each one becomes a row on the status page.
#
# Common fields:
#   name    - display name (must be unique, used as the history key)
#   type    - "http", "tcp", or "heartbeat"
#   timeout - seconds to wait before treating the check as failed (default: 10)
#
# http fields:
#   url     - full URL to request (2xx/3xx = healthy, redirects not followed)
#
# tcp fields:
#   host - hostname or IP
#   port - TCP port number
#
# heartbeat fields (for machines GitHub Actions can't reach directly, e.g.
# behind a VPN -- see README.md "VPN-only machines"):
#   slug     - matches the slug passed to `scripts/heartbeat.py <slug>` on the machine
#   max_age  - seconds since the last heartbeat before considered down (default: 900)

monitors:
  # Sites
  - name: ROARS Website
    type: http
    url: https://roars.dev
    timeout: 10

  - name: VietProfs
    type: http
    url: https://vietprofs.roars.dev
    timeout: 10

  - name: CSPicks
    type: http
    url: https://cspicks.roars.dev
    timeout: 10

  - name: DIG
    type: http
    url: https://dig.roars.dev
    timeout: 10

  - name: BibTeX
    type: http
    url: https://bibtex.roars.dev
    timeout: 10

  - name: Real GMU CS People
    type: http
    url: https://realgmucs.github.io/people/
    timeout: 10

  # Machines (Heartbeat monitors)
  - name: Prime
    type: heartbeat
    slug: prime

