<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROARS Status</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>ROARS STATUS</h1>
      <div id="overall" class="overall">
        <span class="dot"></span>
        <span id="overall-text">Loading&hellip;</span>
      </div>
    </header>

    <section id="monitors" class="monitors">
      <p class="loading">Loading monitors&hellip;</p>
    </section>

    <section id="incidents-section" class="incidents" hidden>
      <h2>Recent Incidents</h2>
      <ul id="incidents"></ul>
    </section>

    <footer class="footer">
      <span id="updated">&nbsp;</span>
      <span class="sep">&middot;</span>
      <span>checks run every 5 minutes via GitHub Actions</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
