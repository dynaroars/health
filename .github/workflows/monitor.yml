name: Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Serialize runs so two overlapping executions never race on the "data"
# branch or on a Pages deployment. Runs queue rather than cancel each other,
# since a check should finish in seconds and we don't want a half-applied
# history update.
concurrency:
  group: "status-monitor"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Prepare data branch worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data:data
            git worktree add data-branch data
          else
            echo "no 'data' branch yet, creating an orphan one"
            git worktree add --orphan -b data data-branch
          fi
          mkdir -p data-branch/data

      - name: Run checks
        run: python scripts/check.py --config config/monitors.yml --data-dir data-branch/data

      # Open/close GitHub issues for problems (see scripts/notify.py). A failure
      # here must never block updating the dashboard.
      - name: Open or close alert issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/notify.py data-branch/data/status.json

      - name: Commit updated history
        working-directory: data-branch
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "update status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Machines pushing heartbeats (scripts/heartbeat.py) can land commits
          # on this branch between our fetch and our push, so retry with a
          # rebase instead of failing on a non-fast-forward push. All machines'
          # crons fire on the same 5-minute boundary, so heartbeats arrive in a
          # burst of a few seconds; back off with jitter to let it pass rather
          # than retrying immediately into the same burst.
          for attempt in 1 2 3 4 5 6; do
            if git push origin data; then
              exit 0
            fi
            delay=$(( attempt * 3 + RANDOM % 5 ))
            echo "push rejected, retrying in ${delay}s after rebasing onto latest data (attempt $attempt)"
            sleep "$delay"
            git fetch origin data
            git rebase origin/data
          done
          echo "::error::failed to push updated history after retries"
          exit 1

      - name: Assemble Pages site
        run: |
          mkdir -p _site/files
          cp index.html _site/
          cp files/org.css _site/files/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
